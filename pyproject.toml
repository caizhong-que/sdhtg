[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdhtg"
version = "0.1.0"
description = "Differentiable hierarchical temporal graph learning for log anomaly detection"
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch==2.5.1",
  "torch-geometric==2.5.3",
  "numpy==2.4.6",
  "scikit-learn==1.5.0",
  "pandas==3.0.3",
  "pyarrow==25.0.0",
  "PyYAML==6.0.1",
  "drain3==0.9.11",
  "tqdm==4.66.4",
  "requests==2.34.2",
]

[project.optional-dependencies]
dev = ["pytest==8.2.2", "ruff==0.5.0", "mypy==1.10.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
