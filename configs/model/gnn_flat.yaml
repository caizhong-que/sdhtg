model:
  arch: gnn_flat
  template_vocab_size: 4096
  entity_vocab_size: 1024
  action_vocab_size: 1024
  status_vocab_size: 4096
  hidden_dim: 256
  strategy_dim: 64
  time_dim: 32
  num_gru_layers: 2
  graph_layers: 2
  graph_heads: 4
  dropout: 0.10
  num_normal_prototypes: 8
  prototype_temperature: 0.10
  prototype_similarity_threshold: 0.2
  detector_pool_temperature: 0.20
  local_temporal_radius:
    status: 8
    action: 4
    entity: 2
  semantic_neighbors:
    status: 4
    action: 4
    entity: 2
  graph_relations:
    temporal: true
    semantic: true
    containment: false
    reverse_containment: false
    self_loops: true
  ablation:
    use_hierarchy: false
    use_strategy_film: false
    use_prototypes: true
    use_cross_level_messages: false
  boundary:
    mode: learned
    force_first_boundary: true
  hierarchy:
    membership_epsilon: 1.0e-6
    minimum_node_mass: 1.0e-5
